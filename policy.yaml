version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /etc, /dev/urandom, /var/log]
  read_write: [/app, /tmp, /var/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  local_ollama:
    endpoints:
      - host: host.openshell.internal
        port: 11434
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/local/bin/node
